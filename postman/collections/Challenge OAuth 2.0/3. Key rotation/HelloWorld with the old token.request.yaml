$kind: http-request
url: "{{resourceServerUrl}}/api/hello"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{accessToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Still accepted while the previous key is published', () => {
        pm.response.to.have.status(200);
      });
    language: text/javascript
order: 4000
