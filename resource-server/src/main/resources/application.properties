spring.application.name=resource-server
server.port=8080
resource-server.url=${RESOURCE_SERVER_URL:http://localhost:8080}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${TOKEN_ISSUER:http://localhost:9000}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWK_SET_URI:http://localhost:9000/.well-known/jwks.json}
spring.security.oauth2.resourceserver.jwt.audiences=${TOKEN_AUDIENCE:hello-api}
spring.security.oauth2.resourceserver.jwt.jws-algorithms=RS256
